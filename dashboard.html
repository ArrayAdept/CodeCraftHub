<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeCraftHub | Learning Dashboard</title>
<style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#172033;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0}.top{background:#111827;color:white;padding:18px 5%}.brand{font-weight:800;font-size:20px}
main{max-width:1100px;margin:32px auto;padding:0 18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0 0 6px;font-size:clamp(27px,4vw,38px)}p{color:#697386}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#4f46e5;color:white}.secondary{background:#edf0f7;color:#202a40}.danger{background:#fff0f0;color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.stat,.card,.panel{background:white;border:1px solid #e2e7f0;border-radius:14px;padding:18px;box-shadow:0 7px 20px #1720330b}.stat small{color:#697386}.num{font-size:28px;font-weight:800;margin-top:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 14px}.toolbar h2{margin:0}.search,input,textarea,select{font:inherit;border:1px solid #d7ddea;border-radius:9px;padding:10px;width:100%;background:white}.search{max-width:300px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:220px}.id{font-size:12px;color:#697386}.card h3{margin:7px 0}.desc{line-height:1.5;overflow-wrap:anywhere}.status{font-size:12px;font-weight:800;border-radius:20px;padding:5px 8px;background:#f1f5f9;align-self:flex-start}.status.in-progress{background:#fef3c7;color:#92400e}.status.completed{background:#dcfce7;color:#166534}.meta{font-size:13px;color:#697386;margin-top:auto;padding-top:12px;border-top:1px solid #edf0f5}.actions{display:flex;gap:8px;margin-top:12px}.empty,.message{background:white;border:1px dashed #cbd5e1;border-radius:12px;padding:25px;text-align:center;color:#697386;grid-column:1/-1}.message{margin:18px 0;text-align:left;border-style:solid}.error{background:#fff4f4;color:#991b1b;border-color:#fecaca}.success{background:#f0fdf4;color:#166534;border-color:#bbf7d0}.hidden{display:none!important}
.backdrop{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:16px;z-index:5}.modal{background:white;border-radius:16px;padding:24px;width:min(520px,100%);max-height:94vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin-top:0}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:14px;font-weight:700}textarea{min-height:90px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:9px}.close{border:0;border-radius:8px;padding:7px 12px;font-size:20px;cursor:pointer}
footer{text-align:center;color:#8790a1;padding:25px;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.num{font-size:23px}.search{max-width:none}.hero .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand">▦ CodeCraftHub</div></header>
<main>
<section class="hero"><div><h1>Learning Dashboard</h1><p>Manage courses, track progress, and organize your learning goals.</p></div><button class="btn primary" id="add">＋ Add course</button></section>
<div id="message" class="message hidden" role="status"></div>
<section class="stats"><div class="stat"><small>Total courses</small><div class="num" id="total">—</div></div><div class="stat"><small>In progress</small><div class="num" id="progress">—</div></div><div class="stat"><small>Completed</small><div class="num" id="completed">—</div></div></section>
<section><div class="toolbar"><h2>Your courses</h2><input id="search" class="search" type="search" placeholder="Search courses…"></div><div id="courses" class="grid"><div class="empty">Loading courses…</div></div></section>
</main><footer>CodeCraftHub · Learning dashboard powered by your Flask REST API</footer>
<div id="backdrop" class="backdrop hidden" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><h2 id="formTitle">Add course</h2><button class="close" id="close" type="button">×</button></div>
<form id="form" class="form"><input id="id" type="hidden"><div class="field"><label for="name">Course name *</label><input id="name" required maxlength="120" placeholder="e.g. Python Basics"></div><div class="field"><label for="description">Description</label><textarea id="description" maxlength="1000" placeholder="What will you learn?"></textarea></div><div class="field"><label for="date">Target date</label><input id="date" type="date"></div><div class="field"><label for="status">Status</label><select id="status"><option>Not Started</option><option>In Progress</option><option>Completed</option></select></div><div id="formError" class="error hidden"></div><div class="formactions"><button class="btn secondary" id="cancel" type="button">Cancel</button><button class="btn primary" id="save" type="submit">Save course</button></div></form></div></div>
<script>
const API_URL="http://127.0.0.1:5000/api/courses";
let courses=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function statusClass(s){return String(s||"Not Started").toLowerCase().replace(/\s+/g,"-");}
function message(text,type="success"){$("message").textContent=text;$("message").className="message "+type;if(type==="success")setTimeout(()=>$("message").classList.add("hidden"),3500);}
async function api(url,opts={}){let res;try{res=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}})}catch(e){throw Error("Cannot reach Flask. Start app.py and check the CORS setup instructions.");}let raw=await res.text(),data=null;try{data=raw?JSON.parse(raw):null}catch{data={message:raw}}if(!res.ok)throw Error(data?.error||data?.message||`HTTP ${res.status}`);return data;}
function render(){const q=$("search").value.trim().toLowerCase();const filtered=courses.filter(c=>[c.name,c.description,c.status].some(v=>String(v||"").toLowerCase().includes(q)));$("total").textContent=courses.length;$("progress").textContent=courses.filter(c=>statusClass(c.status)==="in-progress").length;$("completed").textContent=courses.filter(c=>statusClass(c.status)==="completed").length;
if(!filtered.length){$("courses").innerHTML=`<div class="empty">${courses.length?"No courses match your search.":"No courses yet. Click Add course to get started."}</div>`;return;}
$("courses").innerHTML=filtered.map(c=>`<article class="card"><div class="id">COURSE #${esc(c.id)}</div><h3>${esc(c.name)}</h3><span class="status ${esc(statusClass(c.status))}">${esc(c.status||"Not Started")}</span><p class="desc">${esc(c.description||"No description added.")}</p><div class="meta">${c.target_date?"Target date: "+esc(c.target_date):"No target date set"}</div><div class="actions"><button class="btn secondary" data-action="edit" data-id="${esc(c.id)}">Edit</button><button class="btn danger" data-action="delete" data-id="${esc(c.id)}">Delete</button></div></article>`).join("");}
async function load(){ $("courses").innerHTML='<div class="empty">Loading courses…</div>';try{const data=await api(API_URL);courses=Array.isArray(data)?data:(data?.courses||[]);render();}catch(e){$("courses").innerHTML=`<div class="empty">Could not load courses.<br><br>${esc(e.message)}<br><br>Start your Flask backend and refresh this page.</div>`;$("total").textContent=$("progress").textContent=$("completed").textContent="—";}}
function openForm(c=null){$("form").reset();$("formError").classList.add("hidden");$("id").value=c?.id??"";$("formTitle").textContent=c?"Edit course":"Add course";$("save").textContent=c?"Save changes":"Save course";$("name").value=c?.name??"";$("description").value=c?.description??"";$("date").value=c?.target_date??"";$("status").value=c?.status??"Not Started";$("backdrop").classList.remove("hidden");$("name").focus();}
function closeForm(){$("backdrop").classList.add("hidden");}
$("add").onclick=()=>openForm();$("close").onclick=closeForm;$("cancel").onclick=closeForm;$("search").addEventListener("input",render);$("backdrop").addEventListener("click",e=>{if(e.target===$("backdrop"))closeForm()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeForm()});
$("courses").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const c=courses.find(x=>String(x.id)===b.dataset.id);if(!c)return;if(b.dataset.action==="edit"){openForm(c);return;}if(confirm(`Delete "${c.name}"? This cannot be undone.`)){b.disabled=true;try{await api(`${API_URL}/${encodeURIComponent(c.id)}`,{method:"DELETE"});message("Course deleted.");await load();}catch(err){message(err.message,"error");b.disabled=false;}}});
$("form").addEventListener("submit",async e=>{e.preventDefault();const id=$("id").value,payload={name:$("name").value.trim(),description:$("description").value.trim(),target_date:$("date").value,status:$("status").value};if(!payload.name){$("formError").textContent="Course name is required.";$("formError").classList.remove("hidden");return;}const btn=$("save");btn.disabled=true;btn.textContent="Saving…";try{if(id){await api(`${API_URL}/${encodeURIComponent(id)}`,{method:"PUT",body:JSON.stringify(payload)});message("Course updated successfully.");}else{await api(API_URL,{method:"POST",body:JSON.stringify(payload)});message("Course created successfully.");}closeForm();await load();}catch(err){$("formError").textContent=err.message;$("formError").classList.remove("hidden");}finally{btn.disabled=false;btn.textContent=id?"Save changes":"Save course";}});
load();
</script>
</body>
</html>
